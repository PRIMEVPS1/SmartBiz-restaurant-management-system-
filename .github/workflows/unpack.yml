name: Unpack
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo
        run: |
          unzip -q -o *.zip
          rm -rf smartbiz/.git
          cp -r smartbiz/. .
          rm -rf smartbiz *.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack SmartBiz" || true
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test build
        run: npm install --no-audit --no-fund && npm run build
